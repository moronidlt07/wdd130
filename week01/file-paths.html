</head>

<body>
    <h1>File Path Activity</h1>
    <p>Fix the image tags below so that they each display the correct image.</p>

    <p>A temple image file in the images subfolder:</p>
    <img src="images/aba-nigeria-temple.jpeg"
      alt="The Aba Nigeria Temple, a place of worship set within its landscaped grounds, presents a peaceful and reverent scene.">

    <p>A temple image file in the root images folder:</p>
    <img src="../images/salt-lake-temple.jpg"
      alt="The Salt Lake Temple, a historic stone temple with tall towers rising above its grounds, creates a stately and reverent scene.">

    <p>A temple image file with an absolute path:</p>
    <img
      src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/anchorage-alaska/320x180/anchorage-temple-lds-253274-wallpaper.jpg"
      alt="The Anchorage Alaska Temple, a place of worship framed by the natural surroundings of Alaska, creates a peaceful and reverent scene.">

</body>

</html>
